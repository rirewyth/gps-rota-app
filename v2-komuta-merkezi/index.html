<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Komuta Merkezi - PRO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            accent: '#3b82f6',
                            danger: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        #map { z-index: 10; height: 100%; width: 100%; }
        .leaflet-container { background: #1e293b; }
        .leaflet-bar a { background-color: #334155 !important; color: #f8fafc !important; border-bottom-color: #0f172a !important; }
        
        /* Custom map markers */
        .pulse-marker {
            width: 16px;
            height: 16px;
            background-color: #3b82f6;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 0 rgba(59, 130, 246, 0.4);
            animation: pulse 2s infinite;
        }
        .pulse-danger {
            background-color: #ef4444;
            box-shadow: 0 0 0 rgba(239, 68, 68, 0.4);
            animation: pulse-red 1s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.9); }
            70% { box-shadow: 0 0 0 25px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-brand-900 text-slate-200 h-screen overflow-hidden flex selection:bg-brand-accent selection:text-white">

    <!-- Sidebar -->
    <aside class="w-80 bg-brand-800 border-r border-brand-700 flex flex-col h-full shadow-2xl z-20">
        <div class="p-6 border-b border-brand-700">
            <h1 class="text-2xl font-black text-white flex items-center gap-2 tracking-tight">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-brand-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                RotaPlus<span class="text-brand-accent">PRO</span>
            </h1>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest font-semibold">Komuta Merkezi v2.0</p>
        </div>

        <!-- Live Feed -->
        <div class="p-4 flex-1 overflow-y-auto">
            <h2 class="text-xs uppercase text-slate-500 font-bold mb-4 tracking-wider">Canlı Saha Akışı</h2>
            <div id="activity-feed" class="space-y-3">
                <!-- Feed items will be injected by JS -->
            </div>
        </div>

        <div class="p-4 border-t border-brand-700 bg-brand-900/50">
            <button onclick="simulateEmergency()" class="w-full bg-brand-700 hover:bg-brand-danger text-white py-3 rounded-lg text-sm font-bold transition-all duration-300 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                Acil Durum Testi
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative">
        <!-- Topbar Stats -->
        <header class="h-24 bg-brand-900/90 backdrop-blur-md border-b border-brand-700 px-8 flex items-center justify-between z-20 absolute top-0 w-full pointer-events-none">
            <div class="grid grid-cols-3 gap-8 w-full max-w-4xl pointer-events-auto">
                <!-- Stat 1 -->
                <div class="flex flex-col">
                    <span class="text-slate-400 text-xs font-bold uppercase tracking-wider">Aktif Ekipler</span>
                    <div class="flex items-baseline gap-2 mt-1">
                        <span id="stat-active" class="text-3xl font-black text-white">0</span>
                        <span class="text-sm font-medium text-green-400 flex items-center">Sahada</span>
                    </div>
                </div>
                <!-- Stat 2 -->
                <div class="flex flex-col border-l border-brand-700 pl-8">
                    <span class="text-slate-400 text-xs font-bold uppercase tracking-wider">Toplam Rota</span>
                    <div class="flex items-baseline gap-2 mt-1">
                        <span id="stat-routes" class="text-3xl font-black text-white">1,204</span>
                        <span class="text-sm font-medium text-slate-400">km</span>
                    </div>
                </div>
                <!-- Stat 3 -->
                <div class="flex flex-col border-l border-brand-700 pl-8">
                    <span class="text-slate-400 text-xs font-bold uppercase tracking-wider">Sistem Uyarıları</span>
                    <div class="flex items-baseline gap-2 mt-1">
                        <span id="stat-alerts" class="text-3xl font-black text-brand-accent">0</span>
                        <span class="text-sm font-medium text-slate-400" id="stat-alerts-text">Normal</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-4 pointer-events-auto">
                <div class="flex items-center gap-2 bg-brand-800 px-4 py-2 rounded-full border border-brand-700">
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                    <span class="text-sm font-bold text-slate-300">Sistem Çevrimiçi</span>
                </div>
            </div>
        </header>

        <!-- Interactive Map Container -->
        <div id="map" class="flex-1 w-full bg-brand-800"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
